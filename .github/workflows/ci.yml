name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore StudyRoom.slnx

      - name: Build
        run: dotnet build StudyRoom.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test StudyRoom.slnx --configuration Release --no-build --verbosity normal
